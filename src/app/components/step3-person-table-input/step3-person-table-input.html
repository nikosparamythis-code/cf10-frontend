@if (!person) {
  <div class="alert alert-danger text-center">No person details</div>
} @else {
  <div>
    <table class="table table-bordered w-50">
      <tr>
        <td class="fw-semibold">First Name</td>
        <td class="ps-2">{{ person.firstname }}</td>
      </tr>
      <tr>
        <td class="fw-semibold">Last Name</td>
        <td class="ps-2">{{ person.lastname }}</td>
      </tr>
      <tr>
        <td class="fw-semibold">Email</td>
        <td class="ps-2">{{ person.email }}</td>
      </tr>
    </table>
  </div>
}
