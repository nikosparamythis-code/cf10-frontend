<div class="d-flex flex-column">
  <h5>New User Form</h5>
  <form #eform="ngForm" class="d-flex flex-column">
    <mat-form-field>
      <mat-label>First Name</mat-label>
      <input matInput required type="text" name="firstname" ngModel #firstname="ngModel" />
      <mat-error>First Name is required</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Last Name</mat-label>
      <input matInput required name="lastname" type="text" ngModel #lastname="ngModel" />
      <mat-error>Last name is required</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Email</mat-label>
      <input
        type="text"
        matInput
        required
        name="email"
        pattern="[a-zA-Z0-9\.\-]+@[a-zA-Z0-9\.\-]+\.[a-zA-Z]{2,}"
        ngModel
        #email="ngModel"
      />
      @if (email.errors && email.errors['required']) {
        <mat-error>Email is required field</mat-error>
      }
      @if (email.errors && email.errors['pattern']) {
        <mat-error>Invalid</mat-error>
      }
    </mat-form-field>
  </form>

  <button
    mat-flat-button
    color="primary"
    [disabled]="eform.invalid"
    (click)="onSubmit(eform.value)"
  >
    Submit
  </button>
  <div class="d-flex flex-column mt-2 gap4">
    <app-step3-person-table-input [person]="currentPerson"></app-step3-person-table-input>
    <app-step8-simple-data-table [data]="persons"></app-step8-simple-data-table>
    {{ persons | json }}
  </div>
</div>
